name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Thank you for opening your first issue! We will look into it as soon as possible. '
        pr-message: 'Thank you for your first Pull Request! I will review your code shortly. Make sure the tests pass! '
